<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PAINTFALL: Battle Arena</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#090b12;color:#fff;touch-action:none}main{max-width:1180px;margin:auto;padding:18px;padding-bottom:220px}button,input,select{font:inherit;padding:12px 14px;border-radius:11px;border:1px solid #39445d;background:#0b0f18;color:#fff}button{cursor:pointer;background:#7047ff;border:0;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap}.card{background:#151a26;border:1px solid #31394d;border-radius:20px;padding:20px;margin-top:18px}.hidden{display:none!important}canvas{display:block;width:100%;background:#172033;border-radius:18px;touch-action:none}.paintHitsBanner{display:flex;justify-content:center;margin:10px 0;padding:10px;border-radius:14px;background:#182338;border:2px solid #7047ff;font-weight:900}.weaponbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stats{display:flex;gap:8px;margin:8px 0}.stat{padding:6px 10px;background:#121827;border-radius:9px}.hudLeave{background:#252d3f}#mobileHUD{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));z-index:2147483647;display:none;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none}.mobileStick{width:132px;height:132px;border-radius:50%;background:rgba(35,45,65,.98);border:3px solid #fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;position:relative;pointer-events:auto;color:#fff;font-weight:900;touch-action:none;box-shadow:0 8px 28px #000}.mobileKnob{width:58px;height:58px;border-radius:50%;background:#705cff;border:3px solid #fff;position:absolute;left:34px;top:34px}.mobileBtns{display:flex;flex-direction:column;gap:12px;align-items:flex-end;pointer-events:none}.mobileCombatBtns{display:flex;gap:14px;pointer-events:none}.mobileBtn{width:92px;height:92px;border-radius:50%;border:4px solid #fff;color:#fff;font-weight:1000;font-size:15px;pointer-events:auto;touch-action:none;box-shadow:0 8px 25px #000;text-shadow:0 2px 4px #000}.mobileJump{background:#7047ff}.mobileFire{background:#ff4b43}.mobileAbility{background:#24a6a6}@media(max-width:700px){main{padding:10px;padding-bottom:220px}}#game.started #preMatch{display:none!important}#game:not(.started) #arena,#game:not(.started) .stats,#game:not(.started) .matchActions,#game:not(.started) .weaponbar{display:none!important}</style><link rel="stylesheet" href="/paintfall-account.css"></head><body><main><h1>🎨 PAINTFALL</h1><div>Your world. Your way. • PAINTFALL</div><section id="lobby" class="card"><h2>⚡ Create or Join</h2><div class="row"><input id="name" placeholder="Your name" maxlength="16"><select id="mode"><option value="paintball">Paintball Battle</option><option value="combat" disabled>Blaster Combat — Coming soon</option><option value="zombies" disabled>Dragon Zombie — Coming soon</option><option value="story" disabled>Story Mode — Coming soon</option></select><button onclick="createRoom()">Create Room</button></div><div class="row"><input id="code" placeholder="Room code"><button onclick="joinRoom()">Join Room</button></div><div id="status">Create a room and share the code with another player.</div></section><section id="game" class="hidden"><div id="preMatch" class="loadoutCard"><h2>🎨 Before the Match</h2><div class="coreChoice"><b>❄️ Frost Paint Core</b><button onclick="chooseWeapon('paint')">Selected ✓</button></div><div class="paintAccessory">🎨 Paint Attack — paint-filled attack accessory.</div><div class="row"><button onclick="startGame()">🚀 Enter Match</button><button class="hudLeave" onclick="leave()">Leave Match</button></div></div><div id="paintHitsAbove" class="paintHitsBanner">🎯 Paint Hits: 0 / 10</div><canvas id="arena" width="1200" height="700"></canvas><div id="weaponbar" class="weaponbar"><button id="paint" onclick="chooseWeapon('paint')">❄️ Frost Paint Core</button></div><div class="stats"><span class="stat" id="weaponStat">Weapon: Paint Blaster</span><span class="stat" id="rewardStat">Rewards: —</span></div><div class="row matchActions"><button onclick="startGame()">Start / Next Round</button><button onclick="leave()">Leave Match</button></div></section></main><div id="mobileHUD"><div id="mobileStick" class="mobileStick"><div id="mobileKnob" class="mobileKnob"></div><span>MOVE</span></div><div class="mobileBtns"><button id="mobileAbility" class="mobileBtn mobileAbility hidden" type="button">ABILITY</button><div class="mobileCombatBtns"><button id="mobileJump" class="mobileBtn mobileJump" type="button">JUMP</button><button id="mobileFire" class="mobileBtn mobileFire" type="button">FIRE</button></div></div></div><script src="/paintfall-maya-ability.js"></script><script src="/paintfall-zara-ability.js"></script><script src="/paintfall-jax-ability.js"></script><script src="/paintfall-arena-catalog.js"></script><script src="/paintfall-movement-sync.js"></script><script src="/paintfall-splash-landing.js"></script><script src="/paintfall-input-controls.js"></script><script>const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');let ws,me,code,players=[],mode='paintball',started=false,startRequested=false,joy={x:0,y:0};function local(){return players.find(p=>p.id===me)||window.PAINTFALL_LAST_PLAYER_STATE||null}function gameSocket(){const s=window.paintfallSocket||ws;return s&&s.readyState===1?s:null}function chooseWeapon(w){const s=gameSocket();if(s)s.send(JSON.stringify({type:'weapon',weapon:w}))}function inputActive(){return !window.PAINTFALL_CONNECTION_LOST&&!window.PAINTFALL_ACCOUNT_LOCKED&&!window.PAINTFALL_FAMILY_MANAGING&&!window.PAINTFALL_DISCOVERY_OPEN&&!window.PAINTFALL_DROP_CHOOSING&&!window.PAINTFALL_WORLD_EXPLORING&&!!(started||startRequested||$('game').classList.contains('started'))}function fire(){const s=gameSocket();if(!inputActive()||!s)return;if(window.paintfallTryAnimalShot?.())return;const p=local(),t=players.find(q=>q.id!==me&&q.alive&&q.arenaRegion===p?.arenaRegion)||null;const fireDetail={shooter:p,target:t};window.paintfall3DPlayerInit?.();if(window.paintfall3DPlayerFire)window.paintfall3DPlayerFire(fireDetail);else(window.__paintfallPending3DActions??=[]).push({type:'fire',detail:fireDetail});const msg={type:'shoot'};if(t)msg.target=t.id;s.send(JSON.stringify(msg))}function splashLanding(){const s=gameSocket(),p=local();if(inputActive()&&s&&p?.alive&&p.grounded===false&&p.z>0)s.send(JSON.stringify({type:"splash-land"}))}function jump(){if(!inputActive())return;if(local()?.grounded===false&&local().z>0){splashLanding();return;}const s=gameSocket();window.paintfall3DPlayerInit?.();if(window.paintfall3DPlayerJump)window.paintfall3DPlayerJump();else(window.__paintfallPending3DActions??=[]).push({type:'jump'});if(s)s.send(JSON.stringify({type:'jump'}))}function ability(){const s=gameSocket(),p=local();if(!inputActive()||!s||!(['Maya','Zara','Jax','Nova'].includes(p?.character)||window.PaintfallCoreAbilities?.forCharacter(p?.character))||!p.abilityReady||!p.alive)return;s.send(JSON.stringify({type:'ability'}))}function mobileTouchButton(el,fn){el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();fn()},{passive:false});el.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'){e.preventDefault();e.stopPropagation();fn()}},{passive:false})}mobileTouchButton($('mobileFire'),fire);mobileTouchButton($('mobileJump'),jump);mobileTouchButton($('mobileAbility'),ability);PaintfallInput.bindStick($('mobileStick'),$('mobileKnob'),joy);function isMobileDevice(){return window.matchMedia('(max-width:700px)').matches||(window.matchMedia('(pointer:coarse)').matches&&window.matchMedia('(hover:none)').matches)}function showHUD(){const h=$('mobileHUD');if(!isMobileDevice()){h.style.setProperty('display','none','important');return}h.style.setProperty('display','flex','important');h.style.setProperty('visibility','visible','important');h.style.setProperty('opacity','1','important')}function hideHUD(){$('mobileHUD').style.setProperty('display','none','important')}function startGame(){startRequested=true;started=true;showHUD();updateUI();const s=gameSocket();if(s)s.send(JSON.stringify({type:'start'}))}function leave(){hideHUD();location.reload()}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);window.paintfallSocket=ws;ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='account-saved')window.dispatchEvent(new CustomEvent('paintfall-account-saved',{detail:m}));if(m.type==='account-save-error')window.dispatchEvent(new CustomEvent('paintfall-account-save-error',{detail:m}));if(m.type==='joined'){code=m.code;me=m.id;window.paintfallLocalPlayerId=me;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');showHUD()}if(m.type==='state'){m=window.paintfallApplyState(m,me);started=!!m.started;if(m.started)startRequested=false;else if(!startRequested)started=false;mode=m.mode;window.PAINTFALL_LAST_PLAYER_STATE=players.find(p=>p.id===me)||window.PAINTFALL_LAST_PLAYER_STATE||null;window.dispatchEvent(new CustomEvent('paintfall-3d-state',{detail:m}));updateUI()}if(m.type==='error')$('status').textContent=m.message}}function createRoom(){mode=$('mode').value;connect();setTimeout(()=>ws.send(JSON.stringify({type:'create',name:$('name').value||'Player',mode,rules:{players:2,bots:1,humanPlayers:1}})),250)}function joinRoom(){mode=$('mode').value;connect();setTimeout(()=>ws.send(JSON.stringify({type:'join',name:$('name').value||'Player',code:$('code').value})),250)}function updateUI(){$('game').classList.toggle('started',started);$('weaponbar').style.display=started?'flex':'none';const p=local();const ab=$('mobileAbility');if(ab)ab.classList.toggle('hidden',!p);if(p){$('weaponStat').textContent='Weapon: '+(p.weapon||'Frost Core');$('paintHitsAbove').textContent='🎯 Paint Hits: '+(p.paintHits||0)+' / 10'}}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#172033';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#263854';ctx.lineWidth=3;for(let x=0;x<=1200;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,700);ctx.stroke()}for(let y=0;y<=700;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1200,y);ctx.stroke()}ctx.fillStyle='#263d5c';ctx.fillRect(60,70,230,70);ctx.fillRect(910,70,230,70);ctx.fillRect(480,520,240,80);ctx.fillStyle='#fff';ctx.font='700 26px system-ui';ctx.fillText('PAINTFALL ARENA',30,40);for(const player of players){const world=PaintfallMovement.toWorld(player),p={...player,x:(world.x+26)/52*1200,y:(21-world.z)/42*700};ctx.beginPath();ctx.arc(p.x,p.y,28,0,Math.PI*2);ctx.fillStyle=p.id===me?'#7c4dff':'#ff4b43';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='700 16px system-ui';ctx.textAlign='center';ctx.fillText((p.character||p.name||'Player'),p.x,p.y-40);ctx.fillStyle='#111';ctx.fillRect(p.x-28,p.y+36,56,7);ctx.fillStyle='#d96aff';ctx.fillRect(p.x-28,p.y+36,56*Math.min(1,(p.paint?.marks?.length||0)/32),7)}ctx.textAlign='left'}let keys={};const gameKeys=new Set(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','f','j','k','l']);const movement=PaintfallMovement.createPredictor();let movementRound=-1,lastFrameTime=null;
function publishMovement(){const p=local();window.PAINTFALL_LAST_PLAYER_STATE=p;window.__paintfallLatest3DState={players,id:me,started,round:movementRound};window.dispatchEvent(new CustomEvent('paintfall-3d-state',{detail:window.__paintfallLatest3DState}))}
window.paintfallApplyState=function(m,id){if(Number.isInteger(m.round)&&m.round<movementRound)return window.__paintfallLatest3DState||m;me=id||me;movementRound=m.round??0;const predicted=movement.receive((m.players||[]).find(p=>p.id===me),movementRound);players=(m.players||[]).map(p=>p.id===me&&predicted?predicted:{...p,movementRound});window.PAINTFALL_LAST_PLAYER_STATE=predicted;return {...m,id:me,players}};
function tick(now){requestAnimationFrame(tick);const dt=lastFrameTime===null?0:Math.min(.1,Math.max(0,(now-lastFrameTime)/1000));lastFrameTime=now;if(!window.PAINTFALL_3D_SCENE_HOST){try{draw();}catch(error){console.error('Fallback arena drawing failed:',error);}}const socket=gameSocket();if(inputActive()&&socket&&dt>0){const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);const ky=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);const x=Math.max(-1,Math.min(1,kx+joy.x)),y=Math.max(-1,Math.min(1,ky-joy.y));const direction=window.paintfallMovementInput?window.paintfallMovementInput(x,y):{x,y:-y};const input=movement.step(direction.x,direction.y,dt);if(input){players=players.map(p=>p.id===me?movement.player:p);publishMovement();socket.send(JSON.stringify(input))}}}
function handleGameKey(e,down){const key=(e.key||'').toLowerCase();if((key==='k'||key==='l'||key==='j')&&e.target?.closest?.('input,textarea,select,[contenteditable=true]'))return;if(inputActive()&&gameKeys.has(key)){e.preventDefault();e.stopImmediatePropagation();if(down&&key==='f')fire();if(down&&key==='j'&&!e.repeat&&!keys.j)jump();if(down&&key==='k'&&!e.repeat&&!keys.k)ability();if(down&&key==='l'&&!e.repeat&&!keys.l)splashLanding();keys[key]=down;}}addEventListener('keydown',e=>handleGameKey(e,true),{passive:false,capture:true});addEventListener('keyup',e=>handleGameKey(e,false),{passive:false,capture:true});addEventListener('blur',()=>{keys={};joy.x=joy.y=0;lastFrameTime=null});setInterval(()=>{if(!$('game').classList.contains('hidden'))showHUD()},250);addEventListener('resize',()=>{if(!$('game').classList.contains('hidden'))showHUD()});requestAnimationFrame(tick);</script><script src="/paintfall-game-modes.js"></script><script src="/paintfall-create-chaos.js"></script><script src="/paintfall-game-menu.js"></script><script src="/paintfall-http-party-socket.js"></script><script src="/paintfall-party-connection.js"></script><script src="/paintfall-party-lobby.js"></script><script src="/paintfall-family-room-ui.js"></script><script src="/paintfall-room-connection-ui.js"></script><script>(function(){function useParty(e){const d=e.detail||{};if(!d.socket)return;ws=d.socket;window.paintfallSocket=d.socket;me=d.id||window.PAINTFALL_ROOM_PLAYER_ID||null;window.paintfallLocalPlayerId=me;code=d.code||window.PAINTFALL_ROOM_CODE||null;mode=d.rules?.mode||d.mode||mode;const lobby=document.getElementById("lobby"),game=document.getElementById("game");if(lobby)lobby.classList.add("hidden");if(game)game.classList.remove("hidden");if(typeof showHUD==='function')showHUD();}window.addEventListener('paintfall-party-joined',useParty)})();</script><script src="/paintfall-game-world.js"></script><script src="/paintfall-account.js"></script><script src="/paintfall-arena-drop.js"></script><script src="/paintfall-player-paint.js"></script>
