<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PAINTFALL: Battle Arena</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#090b12;color:#fff;touch-action:none}main{max-width:1180px;margin:auto;padding:18px;padding-bottom:220px}button,input,select{font:inherit;padding:12px 14px;border-radius:11px;border:1px solid #39445d;background:#0b0f18;color:#fff}button{cursor:pointer;background:#7047ff;border:0;font-weight:800}.row{display:flex;gap:10px;flex-wrap:wrap}.card{background:#151a26;border:1px solid #31394d;border-radius:20px;padding:20px;margin-top:18px}.hidden{display:none!important}canvas{display:block;width:100%;background:#172033;border-radius:18px;touch-action:none}.loadoutCard{padding:16px}.coreChoice{margin-top:12px;padding:14px;border:2px solid #7047ff;border-radius:14px;display:flex;justify-content:space-between;gap:12px}.paintAccessory{margin-top:10px;padding:11px}.paintHitsBanner{display:flex;justify-content:center;margin:10px 0;padding:10px;border-radius:14px;background:#182338;border:2px solid #7047ff;font-weight:900}.weaponbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.stats{display:flex;gap:8px;margin:8px 0}.stat{padding:6px 10px;background:#121827;border-radius:9px}.hudLeave{background:#252d3f}#mobileHUD{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));z-index:2147483647;display:none;justify-content:space-between;align-items:flex-end;padding:0 18px;pointer-events:none}.mobileStick{width:132px;height:132px;border-radius:50%;background:rgba(35,45,65,.98);border:3px solid #fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;position:relative;pointer-events:auto;color:#fff;font-weight:900;touch-action:none;box-shadow:0 8px 28px #000}.mobileKnob{width:58px;height:58px;border-radius:50%;background:#705cff;border:3px solid #fff;position:absolute;left:34px;top:34px}.mobileBtns{display:flex;flex-direction:column;gap:12px;align-items:flex-end;pointer-events:none}.mobileCombatBtns{display:flex;gap:14px;pointer-events:none}.mobileBtn{width:92px;height:92px;border-radius:50%;border:4px solid #fff;color:#fff;font-weight:1000;font-size:15px;pointer-events:auto;touch-action:none;box-shadow:0 8px 25px #000;text-shadow:0 2px 4px #000}.mobileJump{background:#7047ff}.mobileFire{background:#ff4b43}.mobileAbility{background:#24a6a6}@media(max-width:700px){main{padding:10px;padding-bottom:220px}}#game.started #preMatch{display:none!important}#game:not(.started) #arena,#game:not(.started) .stats,#game:not(.started) .matchActions,#game:not(.started) .weaponbar{display:none!important}</style></head><body><main><h1>🎨 PAINTFALL</h1><div>Battle Arena — Paintball • Blaster Combat • Dragon Zombie</div><section id="lobby" class="card"><h2>⚡ Create or Join</h2><div class="row"><input id="name" placeholder="Your name" maxlength="16"><select id="mode"><option value="paintball">🎨 Paintball Battle</option><option value="combat">⚔️ Blaster Combat</option><option value="zombies">🐉 Dragon Zombie</option></select><button onclick="createRoom()">Create Room</button></div><div class="row"><input id="code" placeholder="Room code"><button onclick="joinRoom()">Join Room</button></div><div id="status">Create a room and share the code with another player.</div></section><section id="game" class="hidden"><div id="preMatch" class="loadoutCard"><h2>🎨 Before the Match</h2><div class="coreChoice"><b>❄️ Frost Paint Core</b><button onclick="chooseWeapon('paint')">Selected ✓</button></div><div class="paintAccessory">🎨 Paint Attack — paint-filled attack accessory.</div><div class="row"><button onclick="startGame()">🚀 Enter Match</button><button class="hudLeave" onclick="leave()">Leave Match</button></div></div><div id="paintHitsAbove" class="paintHitsBanner">🎯 Paint Hits: 0 / 10</div><canvas id="arena" width="1200" height="700"></canvas><div id="weaponbar" class="weaponbar"><button id="paint" onclick="chooseWeapon('paint')">❄️ Frost Paint Core</button></div><div class="stats"><span class="stat" id="weaponStat">Weapon: Paint Blaster</span><span class="stat" id="rewardStat">Rewards: —</span></div><div class="row matchActions"><button onclick="startGame()">Start / Next Round</button><button onclick="leave()">Leave Match</button></div></section></main><div id="mobileHUD"><div id="mobileStick" class="mobileStick"><div id="mobileKnob" class="mobileKnob"></div><span>MOVE</span></div><div class="mobileBtns"><button id="mobileAbility" class="mobileBtn mobileAbility hidden" type="button">ABILITY</button><div class="mobileCombatBtns"><button id="mobileJump" class="mobileBtn mobileJump" type="button">JUMP</button><button id="mobileFire" class="mobileBtn mobileFire" type="button">FIRE</button></div></div></div><script>const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');let ws,me,code,players=[],mode='paintball',started=false,startRequested=false,joy={x:0,y:0};function local(){return players.find(p=>p.id===me)}function gameSocket(){const s=ws||window.paintfallSocket;return s&&s.readyState===1?s:null}function chooseWeapon(w){const s=gameSocket();if(s)s.send(JSON.stringify({type:'weapon',weapon:w}))}function fire(){const s=gameSocket();if(!started||!s)return;const t=players.find(p=>p.id!==me&&p.alive)||null;const fireDetail={shooter:local(),target:t};window.paintfall3DPlayerInit?.();if(window.paintfall3DPlayerFire)window.paintfall3DPlayerFire(fireDetail);else(window.__paintfallPending3DActions??=[]).push({type:'fire',detail:fireDetail});const msg={type:'shoot'};if(t)msg.target=t.id;s.send(JSON.stringify(msg))}function jump(){if(!started)return;const s=gameSocket();window.paintfall3DPlayerInit?.();if(window.paintfall3DPlayerJump)window.paintfall3DPlayerJump();else(window.__paintfallPending3DActions??=[]).push({type:'jump'});if(s)s.send(JSON.stringify({type:'jump'}))}function ability(){const s=gameSocket();if(!started||!s)return;s.send(JSON.stringify({type:'ability'}))}$('mobileFire').addEventListener('pointerdown',e=>{e.preventDefault();fire()},{passive:false});$('mobileFire').addEventListener('touchstart',e=>{e.preventDefault();fire()},{passive:false});$('mobileFire').addEventListener('pointerup',e=>e.preventDefault(),{passive:false});$('mobileFire').addEventListener('pointercancel',e=>e.preventDefault(),{passive:false});$('mobileJump').addEventListener('pointerdown',e=>{e.preventDefault();jump()},{passive:false});$('mobileJump').addEventListener('touchstart',e=>{e.preventDefault();jump()},{passive:false});$('mobileAbility').addEventListener('pointerdown',e=>{e.preventDefault();ability()},{passive:false});(function(){const s=$('mobileStick'),k=$('mobileKnob');let active=false;function move(e){e.preventDefault();const r=s.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),q=len?Math.min(1,44/len):0;joy.x=dx/Math.max(1,len)*q;joy.y=dy/Math.max(1,len)*q;k.style.transform='translate('+joy.x*44+'px,'+joy.y*44+'px)'}function end(e){if(e)e.preventDefault();active=false;joy.x=joy.y=0;k.style.transform='translate(0,0)'}s.addEventListener('pointerdown',e=>{active=true;s.setPointerCapture?.(e.pointerId);move(e)});s.addEventListener('pointermove',e=>active&&move(e));s.addEventListener('pointerup',end);s.addEventListener('pointercancel',end)})();function isMobileDevice(){return window.matchMedia('(max-width:700px)').matches||(window.matchMedia('(pointer:coarse)').matches&&window.matchMedia('(hover:none)').matches)}function showHUD(){const h=$('mobileHUD');if(!isMobileDevice()){h.style.setProperty('display','none','important');return}h.style.setProperty('display','flex','important');h.style.setProperty('visibility','visible','important');h.style.setProperty('opacity','1','important')}function hideHUD(){$('mobileHUD').style.setProperty('display','none','important')}function startGame(){startRequested=true;started=true;showHUD();updateUI();const s=gameSocket();if(s)s.send(JSON.stringify({type:'start'}))}function leave(){hideHUD();location.reload()}function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){code=m.code;me=m.id;window.paintfallLocalPlayerId=me;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');showHUD()}if(m.type==='state'){players=m.players;started=!!m.started;if(m.started)startRequested=false;else if(!startRequested)started=false;mode=m.mode;window.dispatchEvent(new CustomEvent('paintfall-3d-state',{detail:m}));updateUI()}if(m.type==='error')$('status').textContent=m.message}}function createRoom(){mode=$('mode').value;connect();setTimeout(()=>ws.send(JSON.stringify({type:'create',name:$('name').value||'Player',mode,rules:{players:2,bots:1,humanPlayers:1}})),250)}function joinRoom(){mode=$('mode').value;connect();setTimeout(()=>ws.send(JSON.stringify({type:'join',name:$('name').value||'Player',code:$('code').value})),250)}function updateUI(){$('game').classList.toggle('started',started);$('weaponbar').style.display=started?'flex':'none';const p=local();const ab=$('mobileAbility');if(ab)ab.classList.toggle('hidden',!(p&&((p.abilityReady===true)||(p.abilityAvailable===true)||(p.ability&&p.ability!=='none'))));if(p){$('weaponStat').textContent='Weapon: '+(p.weapon||'Frost Core');$('paintHitsAbove').textContent='🎯 Paint Hits: '+(p.paintHits||0)+' / 10'}}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#172033';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#263854';ctx.lineWidth=3;for(let x=0;x<=1200;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,700);ctx.stroke()}for(let y=0;y<=700;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1200,y);ctx.stroke()}ctx.fillStyle='#263d5c';ctx.fillRect(60,70,230,70);ctx.fillRect(910,70,230,70);ctx.fillRect(480,520,240,80);ctx.fillStyle='#fff';ctx.font='700 26px system-ui';ctx.fillText('PAINTFALL ARENA',30,40);for(const p of players){ctx.beginPath();ctx.arc(p.x,p.y,28,0,Math.PI*2);ctx.fillStyle=p.id===me?'#7c4dff':'#ff4b43';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#fff';ctx.font='700 16px system-ui';ctx.textAlign='center';ctx.fillText((p.character||p.name||'Player'),p.x,p.y-40);ctx.fillStyle='#111';ctx.fillRect(p.x-28,p.y+36,56,7);ctx.fillStyle='#42e66b';ctx.fillRect(p.x-28,p.y+36,56*Math.max(0,p.hp)/100)}ctx.textAlign='left'}let keys={};const gameKeys=new Set(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright','f','j']);function inputActive(){return !!(started||startRequested||$('game').classList.contains('started'))}function sendMove(dx,dy){const socket=ws||window.paintfallSocket;if(!inputActive()||!socket||socket.readyState!==1)return;const p=local();if(!p||!p.alive)return;const nx=Math.max(35,Math.min(1165,p.x+dx));const ny=Math.max(35,Math.min(665,p.y+dy));socket.send(JSON.stringify({type:'move',x:nx,y:ny}))}function tick(){if(!window.PAINTFALL_3D_SCENE_HOST)draw();if(inputActive()){const kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);const ky=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);if(Math.abs(joy.x)+Math.abs(joy.y)>0.02||kx!==0||ky!==0)sendMove(joy.x*7+kx*5,-joy.y*7+ky*5)}requestAnimationFrame(tick)}function handleGameKey(e,down){const key=(e.key||'').toLowerCase();if(inputActive()&&gameKeys.has(key)){e.preventDefault();e.stopImmediatePropagation();if(down&&key==='f')fire();if(down&&key==='j')jump();keys[key]=down;if(down&&['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(key)){const dx=(key==='d'||key==='arrowright'?5:0)-(key==='a'||key==='arrowleft'?5:0);const dy=(key==='w'||key==='arrowup'?5:0)-(key==='s'||key==='arrowdown'?5:0);sendMove(dx,dy)}}}addEventListener('keydown',e=>handleGameKey(e,true),{passive:false,capture:true});addEventListener('keyup',e=>handleGameKey(e,false),{passive:false,capture:true});addEventListener('blur',()=>{keys={}});setInterval(()=>{if(!$('game').classList.contains('hidden'))showHUD()},250);window.addEventListener('resize',()=>{if(!$('game').classList.contains('hidden'))showHUD()});tick();</script><script src="/paintfall-create-chaos.js"></script><script src="/paintfall-party-lobby.js"></script><script>(function(){function useParty(e){const d=e.detail||{};if(!d.socket)return;ws=d.socket;me=d.id||null;window.paintfallLocalPlayerId=me;code=d.code||null;mode=d.rules?.mode||d.mode||mode;window.PAINTFALL_PARTY_MOVEMENT_HOST=!!d.movementHost;const lobby=document.getElementById("lobby"),game=document.getElementById("game");if(lobby)lobby.classList.add("hidden");if(game)game.classList.remove("hidden");if(typeof showHUD==="function")showHUD();window.dispatchEvent(new CustomEvent("paintfall-3d-state",{detail:{players:[],started:false,id:me}}))}window.addEventListener("paintfall-party-joined",useParty)})();</script></body></html>
