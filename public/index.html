<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PAINTFALL: Battle Arena</title><style>body{margin:0;font-family:system-ui;background:#10131b;color:#fff;touch-action:none}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:42px;margin:0 0 6px}.sub{color:#aeb6c7}.card{background:#191e2a;border:1px solid #30384a;border-radius:18px;padding:20px;margin-top:18px}button,input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #3a4357;background:#111620;color:#fff}button{cursor:pointer;background:#6d45ff;border:0;font-weight:700}.row{display:flex;gap:10px;flex-wrap:wrap}canvas{display:block;width:100%;max-width:1100px;background:#161b25;border-radius:16px;border:1px solid #30384a;touch-action:none}.hidden{display:none}.status{margin-top:10px;color:#b8c0d0}#hud{display:flex;justify-content:space-between;padding:10px 0;gap:6px;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:999px;background:#272e3e}#controls{display:none;position:fixed;inset:auto 0 18px 0;pointer-events:none;justify-content:space-between;padding:0 22px;z-index:10}.stick{width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;position:relative;pointer-events:auto}.knob{width:52px;height:52px;border-radius:50%;background:#ffffff77;position:absolute;left:34px;top:34px}.fire{width:88px;height:88px;border-radius:50%;background:#ff5b4d;border:3px solid #fff;color:#fff;font-weight:800;pointer-events:auto}.hint{font-size:13px;color:#9da7bb}@media(max-width:700px){main{padding:12px}h1{font-size:32px}.card{padding:14px}#controls{display:flex}.hint{display:none}canvas{height:auto}}</style></head><body><main><h1>🎨 PAINTFALL</h1><div class="sub">Battle Arena — Paintball • Combat • Dragon Zombie</div><section id="lobby" class="card"><h2>Create or Join</h2><div class="row"><input id="name" placeholder="Your name" maxlength="16"><select id="mode"><option value="paintball">Paintball Battle</option><option value="combat">Combat</option><option value="zombies">Dragon Zombie</option></select><button onclick="createRoom()">Create Room</button></div><div class="row" style="margin-top:12px"><input id="code" placeholder="Room code"><button onclick="joinRoom()">Join Room</button></div><div id="status" class="status">Create a room and share the code with another player.</div></section><section id="game" class="hidden"><div id="hud"><span class="pill" id="roomLabel"></span><span class="pill" id="modeLabel"></span><span class="pill hint">WASD / arrows or mobile joystick • Click / FIRE to shoot</span></div><canvas id="arena" width="1200" height="700"></canvas><div id="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><button class="fire" id="fire">FIRE</button></div><div class="row" style="margin-top:12px"><button onclick="startGame()">Start / Restart</button><button onclick="leave()">Leave</button></div></section></main><script>const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');let ws,me,code,players=[],mode='paintball',started=false,boss=null,joy={x:0,y:0};let keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function shootAt(x,y){if(!started||!ws||ws.readyState!==1)return;let targets=players.filter(p=>p.id!==me&&p.alive);if(mode==='zombies'&&boss&&!boss.defeated){ws.send(JSON.stringify({type:'bossHit',damage:20}));return}if(targets.length){targets.sort((a,b)=>(a.x-x)**2+(a.y-y)**2-(b.x-x)**2-(b.y-y)**2);ws.send(JSON.stringify({type:'shoot',target:targets[0].id,damage:mode==='combat'?30:20}))}}canvas.addEventListener('click',e=>{const r=canvas.getBoundingClientRect();shootAt((e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height)});$('fire').addEventListener('touchstart',e=>{e.preventDefault();shootAt(canvas.width/2,canvas.height/2)},{passive:false});function setupStick(){const s=$('stick'),k=$('knob');function move(e){e.preventDefault();const t=e.touches[0],r=s.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=t.clientX-cx,dy=t.clientY-cy,len=Math.hypot(dx,dy),max=42,q=len?Math.min(1,max/len):0;joy.x=dx/Math.max(1,len)*q;joy.y=dy/Math.max(1,len)*q;k.style.transform=`translate(${joy.x*42}px,${joy.y*42}px)`}function end(){joy.x=joy.y=0;k.style.transform='translate(0,0)'}s.addEventListener('touchstart',move,{passive:false});s.addEventListener('touchmove',move,{passive:false});s.addEventListener('touchend',end)}setupStick();function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){code=m.code;me=m.id;$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('roomLabel').textContent='ROOM '+code;$('modeLabel').textContent=mode.toUpperCase()}if(m.type==='state'){players=m.players;started=m.started;boss=m.boss;draw()}if(m.type==='error')$('status').textContent=m.message};ws.onclose=()=>$('status').textContent='Connection closed.'}function createRoom(){mode=$('mode').value;connect();setTimeout(()=>ws.send(JSON.stringify({type:'create',name:$('name').value||'Player',mode})),250)}function joinRoom(){mode=$('mode').value;connect();setTimeout(()=>ws.send(JSON.stringify({type:'join',name:$('name').value||'Player',code:$('code').value})),250)}function startGame(){ws.send(JSON.stringify({type:'start'}))}function leave(){location.reload()}function loop(){if(started&&ws&&ws.readyState===1){let p=players.find(x=>x.id===me);if(p){let dx=(keys.d||keys.arrowright)-(keys.a||keys.arrowleft)+joy.x,dy=(keys.s||keys.arrowdown)-(keys.w||keys.arrowup)+joy.y;if(dx||dy)ws.send(JSON.stringify({type:'move',x:p.x+dx*5,y:p.y+dy*5}))}}requestAnimationFrame(loop)}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#171d28';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#2d3545';for(let x=0;x<1200;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,700);ctx.stroke()}for(let y=0;y<700;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1200,y);ctx.stroke()}players.forEach(p=>{ctx.globalAlpha=p.alive?1:.25;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='14px system-ui';ctx.textAlign='center';ctx.fillText(p.name,p.x,p.y-26);ctx.fillStyle='#333';ctx.fillRect(p.x-22,p.y+25,44,5);ctx.fillStyle='#5ee06d';ctx.fillRect(p.x-22,p.y+25,44*p.hp/100,5);ctx.globalAlpha=1});if(mode==='zombies'&&boss&&!boss.defeated){ctx.fillStyle='#7d243d';ctx.beginPath();ctx.arc(boss.x,boss.y,55,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 20px system-ui';ctx.fillText('DRAGON',boss.x,boss.y+7);ctx.fillStyle='#333';ctx.fillRect(470,25,260,16);ctx.fillStyle='#ff5b4d';ctx.fillRect(470,25,260*boss.hp/1000,16)}if(started&&mode==='zombies'&&boss&&boss.defeated){ctx.fillStyle='#fff';ctx.font='bold 44px system-ui';ctx.textAlign='center';ctx.fillText('DRAGON DEFEATED!',600,350)}else if(started&&players.filter(p=>p.alive).length<=1){ctx.fillStyle='#fff';ctx.font='bold 44px system-ui';ctx.textAlign='center';ctx.fillText('LAST PLAYER STANDING!',600,350)}}loop();draw();</script></body></html>
