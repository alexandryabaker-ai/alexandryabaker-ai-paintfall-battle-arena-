<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAINTFALL character powers and outfits</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101625;color:#edf4ff;font:16px/1.5 system-ui}main{max-width:1180px;margin:auto;padding:20px}a{color:#c9baff}h1{margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:16px 0}button,select{font:inherit;padding:10px;color:white;background:#473475;border:1px solid #af9fd0;border-radius:9px}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}#view{height:650px;position:relative}canvas{display:block;width:100%;height:100%;border-radius:16px}img{width:100%;height:auto}#phase{position:absolute;bottom:12px;left:12px;padding:10px;background:#101625dc;border-radius:9px;max-width:90%;pointer-events:none}p{color:#c7d5ed}@media(max-width:800px){.grid{grid-template-columns:1fr}#view{height:530px}}</style>
<main><a href="/">Back to PAINTFALL</a><h1>Character powers, hair and outfits</h1><p>Local artistic review. These are the same character factory and ability effects used by the arena. Advanced Bond and mastery forms are unfinished.</p>
<div class="controls"><label>Character <select id="hero"><option>Maya</option><option>Zara</option><option>Nova</option><option>Skye</option><option>Jax</option><option>Rico</option><option>Kai</option><option selected>Dante</option></select></label><label>Ability <select id="stage"><option value="normal" selected>Normal outfit</option><option value="learning">Building</option><option value="peak">Overload</option><option value="recovery">Returning to normal</option></select></label><button id="rotate">Rotate</button><label>View <select id="angle"><option value="-.3">Three-quarter</option><option value="0">Front</option><option value="1.57">Side</option><option value="3.14">Back</option></select></label><label>Surface <select id="surface"><option value="599052">Meadow</option><option value="999a9a">Stone</option><option value="b89868">Sand</option></select></label></div>
<div class="grid"><div id="view"><div id="phase" role="status"></div></div><div><img id="reference" alt="Approved character sheet"><p id="details"></p></div></div></main>
<script src="/paintfall-arena-catalog.js"></script><script src="/paintfall-movement-sync.js"></script><script src="/paintfall-maya-ability.js"></script><script src="/paintfall-zara-ability.js"></script><script src="/paintfall-jax-ability.js"></script><script src="/paintfall-core-abilities.js"></script>
<script type="module">
import * as T from './vendor/three.module.js';import {createCharacterFactory} from './paintfall-outdoor-character-factory.js';import {createOutdoorPlayers} from './paintfall-outdoor-players.js';
const host=document.getElementById('view'),scene=new T.Scene();scene.background=new T.Color(0x253447);scene.add(new T.HemisphereLight(0xe9f4ff,0x777463,2));const sun=new T.DirectionalLight(0xffe9d5,2.3);sun.position.set(-3,6,-5);scene.add(sun);const fill=new T.DirectionalLight(0xb9dbff,.7);fill.position.set(3,2,1);scene.add(fill);
const ground=new T.Mesh(new T.PlaneGeometry(100,100),new T.MeshStandardMaterial({color:0x599052,roughness:1}));ground.name='review meadow';ground.rotation.x=-Math.PI/2;scene.add(ground);
const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;host.prepend(renderer.domElement);const camera=new T.PerspectiveCamera(31,1,.1,30),players=createOutdoorPlayers(T,scene,createCharacterFactory(T));
let rotating=false,angle=-.3,last=0;document.getElementById('rotate').onclick=()=>rotating=!rotating;document.getElementById('angle').onchange=e=>{angle=Number(e.target.value);rotating=false;};
document.getElementById('surface').onchange=e=>{ground.material.color.setHex(parseInt(e.target.value,16));ground.name='review '+e.target.selectedOptions[0].textContent.toLowerCase();};
const hero=document.getElementById('hero'),stage=document.getElementById('stage');stage.value='normal';function resize(){renderer.setSize(host.clientWidth,host.clientHeight);camera.aspect=host.clientWidth/host.clientHeight;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(host);resize();
function render(now){const name=hero.value,api=PaintfallCoreAbilities.forCharacter(name)||window['Paintfall'+name+'Ability'];const elapsed=stage.value==='normal'?0:stage.value==='learning'?5000:stage.value==='peak'?(name==='Nova'?22000:name==='Maya'||name==='Zara'?19000:15000):api.TOTAL_MS-3000;
 const type=api.type||{Maya:'maya-confidence',Zara:'zara-emotion',Jax:'jax-dragon',Nova:'nova-energy'}[name];const ability=stage.value==='normal'?null:{type,id:name+stage.value,elapsedMs:elapsed,sampleAt:Math.floor(now/1000)};
 players.update([{id:'review',name,character:name,alive:true,x:600,y:350,z:0,grounded:true,ability}], 'review','third',now);const actor=players.actors.get('review');if(rotating)angle+=(now-last)*.0004;last=now;actor.rotation.y=angle;actor.userData.hairYaw=angle;
 const height=actor.userData.standingHeight;const paired=name==='Kai'&&actor.userData.defaultAbility?.active,focusX=paired?-height*.35:0;camera.position.set(focusX,height*.63,-height*(paired?3.1:2.65));camera.lookAt(focusX,height*.55,0);const state=actor.userData.defaultAbility;document.getElementById('phase').textContent=state?.active?name+' • '+state.label+(state.surface?' • Proposed surface tint: '+state.surface:''):name+' • '+stage.selectedOptions[0].textContent;
 const ref=document.getElementById('reference');if(ref.dataset.hero!==name){ref.dataset.hero=name;ref.src='/review-images/approved-'+name.toLowerCase()+'.png';document.getElementById('details').textContent=name==='Dante'?'Approved default outfit: black and orange, with the sheet’s braided low bun. Physiological Adaptation is confirmed; the surface-color tint shown during ability stages is a proposed effect awaiting your approval.':name==='Rico'?'Ultra Hearing uses nearby in-game movement, jumps and paint shots. Hearing cues are visible to Rico’s player in the arena.':name==='Kai'?'Deterministic Chaos: Kai stays composed while his companion becomes more active. The companion matches Kai with the red/purple clothing pattern reversed.':name==='Skye'?'Reggaetón Rhythm: 3-3-2 visual dance accents, wind and musical notes. Audio and advanced rhythms are separate work.':'Existing confirmed ability. Garment and hair refinement is incremental; facial work is paused.';}
 renderer.render(scene,camera);requestAnimationFrame(render);
}requestAnimationFrame(render);
</script></html>
